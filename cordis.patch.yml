# dsh-notify bundle layer — inserted once per profile that installs this
# bundle. The values below are the composition BASE layer: they stay as the
# defaults, while the DSH 设置 page (设置 → 通知) edits the user layer that
# wins over them at runtime. Schema defaults fill any omitted key.
#
# - enabled / on*  : master switch and per-situation switches (Windows
#   native toasts, ntfy pushes, and in-page toasts all follow them).
# - language       : copy language of the notifications ('zh' | 'en').
# - customTitle    : fixed title overriding the built-in per-situation
#   titles; empty = built-in (任务执行完毕 / 需要权限许可 / 需要你回答).
# - ntfy.*         : ntfy.sh push (browser closed / phone). topic is
#   REQUIRED when enabled; subscribe to the same topic on every device.
#   tags is the fallback for tag-less service messages — built-in
#   per-situation emoji tags win on event notifications.
# - desktopToast.* : Windows native toasts raised by the HOST process — no
#   browser permission involved, works with the page closed. logoPath may
#   point at a local PNG/ICO (empty = bundled DeepSeek whale mark).
- insert:
    - id: dsh-notify
      name: dsh-notify
      config:
        enabled: true
        language: zh
        customTitle: ''
        onStart: false
        onCompletion: true
        onApproval: true
        onQuestion: true
        ntfy:
          enabled: false
          server: https://ntfy.sh
          topic: ''
          token: ''
          priority: default
          tags: robot
          clickUrl: ''
        desktopToast:
          enabled: true
          shell: powershell
          timeoutMs: 10000
          appId: Dsh.Notify
          appName: DSH Notify
          logoPath: ''
          openUrl: http://127.0.0.1:3080
